[project]
name = "customers-quote-generator"
version = "0.1.0"
description = "Generate customer quote PDFs with ReportLab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.2.2",
  "reportlab>=4.4.4",
  "supabase>=2.10.0",
]

[project.scripts]
quote-generator = "quote_generator.app:run"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/quote_generator"]

[dependency-groups]
dev = [
    "flask>=3.1.3",
    "mypy>=1.20.2",
    "pytest>=9.0.2",
]
