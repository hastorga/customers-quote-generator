# Every merge to main ships a release: the version in pyproject.toml is tagged
# (v<version>) and published to GitHub Releases with generated notes.
#
# The bump itself is made by hand on dev, before the dev -> main PR (see
# "Releases" in CLAUDE.md). This workflow does not bump anything; it refuses to
# run when the version was not bumped, so a merge can never silently skip a
# release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Refuse a merge that did not bump the version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. Bump the version in pyproject.toml (and uv.lock) on dev before merging to main."
            exit 1
          fi

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
